apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-api
  labels: {{- include "webapp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: users-api
  template:
    metadata:
      labels:
        app: users-api
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      containers:
        - name: api
          image: {{ include "webapp.image" .Values.api.image }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
          envFrom:
            - configMapRef:
                name: users-api-cm
            - secretRef:
                name: users-api-secret
          readinessProbe:
            httpGet: { path: /api/health, port: {{ .Values.api.port }} }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: {{ .Values.api.port }} }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: users-api-svc
  labels: {{- include "webapp.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    app: users-api
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: {{ .Values.api.port }}

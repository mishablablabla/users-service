apiVersion: v1
kind: Secret
metadata:
  name: users-api-secret
  labels: {{- include "webapp.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.db.name | quote }}
  POSTGRES_USER: {{ .Values.db.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.db.password | quote }}
  # ConnectionString differs per environment: host/user/password come from values.
  DATABASE_URL: "postgresql+psycopg2://{{ .Values.db.user }}:{{ .Values.db.password }}@users-db-svc:5432/{{ .Values.db.name }}"

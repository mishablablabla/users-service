apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-web
  labels: {{- include "webapp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app: users-web
  template:
    metadata:
      labels:
        app: users-web
    spec:
      containers:
        - name: web
          image: {{ include "webapp.image" .Values.web.image }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - containerPort: 80
          env:
            # nginx proxies /api here (useful for port-forward); Ingress routes /api directly
            - name: API_UPSTREAM
              value: "http://users-api-svc:{{ .Values.api.service.port }}"
          readinessProbe:
            httpGet: { path: /, port: 80 }
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: users-web-svc
  labels: {{- include "webapp.labels" . | nindent 4 }}
spec:
  type: {{ .Values.web.service.type }}
  selector:
    app: users-web
  ports:
    - port: {{ .Values.web.service.port }}
      targetPort: 80

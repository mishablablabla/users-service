api:
  image:
    repository: DOCKERHUB_USER/users-api
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  port: 8080
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { memory: 256Mi }

web:
  image:
    repository: DOCKERHUB_USER/users-web
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    type: ClusterIP
    port: 80
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { memory: 64Mi }

migration:
  image:
    repository: DOCKERHUB_USER/users-migrations
    tag: latest
    pullPolicy: IfNotPresent
  backoffLimit: 10

db:
  image: postgres:16-alpine
  name: users
  user: users
  # Demo value; override per environment (values.<env>.yaml or --set-string db.password=...)
  password: change-me
  storage:
    size: 1Gi
    # StorageClass created by this chart (set create=false to use an existing class by name)
    storageClass:
      create: true
      name: users-sc
      provisioner: rancher.io/local-path   # the default provisioner in kind
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

ingress:
  enabled: true
  className: nginx
  host: webapp.lab.test

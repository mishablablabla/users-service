apiVersion: apps/v1
kind: Deployment
metadata:
  name: databasebackup-controller
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: databasebackup-controller }
  template:
    metadata:
      labels: { app: databasebackup-controller }
    spec:
      serviceAccountName: databasebackup-controller
      containers:
        - name: controller
          image: users-controller:dev     # replace with <dockerhub-user>/users-controller:latest outside kind
          imagePullPolicy: IfNotPresent
          env:
            - { name: WATCH_NAMESPACE, value: demo }
            - { name: PG_IMAGE, value: "postgres:16-alpine" }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 128Mi }

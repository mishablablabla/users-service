name: docker-pack-n-push

# Reusable workflow: builds a Docker image and
#  - pushes it to Docker Hub when `push` is true (main branch only, decided by the caller),
#  - otherwise saves the image as a workflow artifact.
on:
  workflow_call:
    inputs:
      repository:
        description: Docker Hub repository name without the user part (e.g. cicd-users-api)
        required: true
        type: string
      tag:
        description: Image tag
        required: false
        type: string
        default: latest
      context:
        description: Docker build context
        required: false
        type: string
        default: .
      dockerfile:
        description: Path to the Dockerfile
        required: false
        type: string
        default: Dockerfile
      push:
        description: Push to Docker Hub (true) or store as artifact (false)
        required: false
        type: boolean
        default: false
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

jobs:
  docker-pack-n-push:
    runs-on: ubuntu-latest
    env:
      # Falls back to a local name when the secret is not set (non-push builds)
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/${{ inputs.repository }}:${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push to Docker Hub
        if: ${{ inputs.push }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=${{ inputs.repository }}
          cache-to: type=gha,mode=max,scope=${{ inputs.repository }}

      - name: Build image (not main branch)
        if: ${{ !inputs.push }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: false
          tags: ${{ env.IMAGE }}
          outputs: type=docker,dest=${{ runner.temp }}/${{ inputs.repository }}.tar
          cache-from: type=gha,scope=${{ inputs.repository }}

      - name: Upload image as artifact
        if: ${{ !inputs.push }}
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ inputs.repository }}
          path: ${{ runner.temp }}/${{ inputs.repository }}.tar
          retention-days: 7

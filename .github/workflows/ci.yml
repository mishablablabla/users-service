name: ci

on:
  push:
    branches:
      - main
      - "feature/*"
      - "bugfix/*"
    # Do not run CI for documentation-only changes
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:

jobs:
  build-n-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt

      - name: Install backend dependencies
        run: pip install -r api/requirements-dev.txt

      - name: Backend unit tests
        working-directory: api
        run: python -m pytest -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npx ng build --configuration production

  docker-pack-n-push:
    needs: build-n-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: cicd-users-api
            context: api
            dockerfile: api/Dockerfile
          - repository: cicd-users-web
            context: web
            dockerfile: web/Dockerfile
          - repository: cicd-users-migrations
            context: .
            dockerfile: migrations/Dockerfile
          - repository: cicd-users-controller
            context: controller
            dockerfile: controller/Dockerfile
    uses: ./.github/workflows/docker-pack-n-push.yml
    with:
      repository: ${{ matrix.repository }}
      tag: latest
      context: ${{ matrix.context }}
      dockerfile: ${{ matrix.dockerfile }}
      # Only the main branch publishes to Docker Hub; other branches keep the image as an artifact
      push: ${{ github.ref == 'refs/heads/main' }}
    secrets: inherit

  helm-package:
    needs: build-n-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint k8s/webapp --strict

      - name: Package chart (version/appVersion come from Chart.yaml)
        run: helm package k8s/webapp --destination dist

      - uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: dist/*.tgz

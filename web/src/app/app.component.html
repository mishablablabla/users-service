<main>
  <h1>Users</h1>

  @if (error) {
    <p class="error">{{ error }}</p>
  }

  <form (ngSubmit)="save()" #f="ngForm">
    <input name="name" placeholder="Name" [(ngModel)]="form.name" required maxlength="100" />
    <input name="email" type="email" placeholder="Email" [(ngModel)]="form.email" required />
    <button type="submit" [disabled]="f.invalid">{{ editingId === null ? 'Add' : 'Save' }}</button>
    @if (editingId !== null) {
      <button type="button" class="secondary" (click)="reset()">Cancel</button>
    }
  </form>

  <table>
    <thead>
      <tr><th>ID</th><th>Name</th><th>Email</th><th></th></tr>
    </thead>
    <tbody>
      @for (u of users; track u.id) {
        <tr>
          <td>{{ u.id }}</td>
          <td>{{ u.name }}</td>
          <td>{{ u.email }}</td>
          <td class="actions">
            <button class="secondary" (click)="edit(u)">Edit</button>
            <button class="danger" (click)="remove(u)">Delete</button>
          </td>
        </tr>
      } @empty {
        <tr><td colspan="4" class="empty">No users yet</td></tr>
      }
    </tbody>
  </table>
</main>
